[project]
name = "term-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soc_agent"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
demo = ["streamlit>=1.30"]
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, UP: pyupgrade (keeps the
# `from __future__ import annotations` style and modern typing consistent).
select = ["E", "F", "I", "UP"]
