[project]
name = "term-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soc_agent"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
demo = ["streamlit>=1.30"]
llm = ["anthropic>=0.40"]
# 評估腳本用的本地 Ollama client（純 Python，跨平台安全）。微調相依（torch/
# transformers/peft/trl）不放這裡：DGX Spark 為 aarch64+CUDA，torch 須走 NVIDIA
# 提供的輪子，見《執行指南》§B 的 DGX 安裝步驟，避免 uv sync 在此拉錯 wheel。
eval = ["ollama>=0.3"]
# 計畫 B 情資增強：abuse.ch HTTP client。延遲 import，核心測試無需安裝此群組。
intel = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, UP: pyupgrade (keeps the
# `from __future__ import annotations` style and modern typing consistent).
select = ["E", "F", "I", "UP"]
